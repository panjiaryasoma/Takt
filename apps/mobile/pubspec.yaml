name: takt_mobile
description: Calendar-aware competition decision support mobile client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  file_picker: ^8.1.2
