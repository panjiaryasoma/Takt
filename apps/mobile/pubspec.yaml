name: takt_mobile
description: Calendar-aware competition decision support mobile client.
publish_to: "none"
version: 0.1.0+5

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  http: ^1.6.0
  drift: ^2.35.0
  file_picker: ^10.3.8
  path: ^1.9.0
  path_provider: ^2.1.4
  provider: ^6.1.2
  timezone: ^0.11.1
  purchases_flutter: ^10.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
    - assets/icon/

flutter_launcher_icons:
  # Source sudah di-flatten jadi opaque (tanpa alpha) -> aman untuk iOS,
  # jadi remove_alpha_ios tidak perlu (versi 0.14.4 bikin hasil hitam).
  image_path: "assets/icon/taktlogo_opaque.png"
  ios: true
  android: true
  adaptive_icon_background: "#2E2A4F"
  adaptive_icon_foreground: "assets/icon/taktlogo.png"
