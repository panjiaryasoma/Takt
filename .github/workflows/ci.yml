name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Record backend audit context
        run: |
          mkdir -p tmp/backend-audit
          uv run --locked python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          paths = ["apps/api", "engine", "packages/contracts", "tests", "scripts",
                   "pyproject.toml", "uv.lock"]
          authorities = ["tests/support/public_error_matrix.py",
                         "tests/fixtures/reliability/recovery_policy_v1.json"]
          context = {
              "audited_commit": git("rev-parse", "HEAD"),
              "audited_tree": git("rev-parse", "HEAD^{tree}"),
              "event_commit": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "python": platform.python_version(),
              "tracked_objects": {p: git("rev-parse", f"HEAD:{p}") for p in paths},
              "authority_sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in authorities},
          }
          Path("tmp/backend-audit/context.json").write_text(json.dumps(context, indent=2) + "\n")
          PY
          uv pip freeze > tmp/backend-audit/dependencies.txt
          tesseract --version > tmp/backend-audit/tesseract.txt
          tesseract --list-langs >> tmp/backend-audit/tesseract.txt
          uv run --locked python scripts/validate_repo.py | tee tmp/backend-audit/repository.log

      - name: Lint
        run: uv run --locked ruff check apps engine packages tests scripts | tee tmp/backend-audit/ruff.log

      - name: Test
        run: uv run --locked pytest -q --junitxml=tmp/backend-audit/pytest.xml | tee tmp/backend-audit/pytest.log

      - name: Upload backend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: tmp/backend-audit/
          if-no-files-found: error
          retention-days: 90

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter lockfile is committed
        run: git diff --exit-code -- pubspec.lock

      - name: Record mobile audit context
        run: |
          set -o pipefail
          mkdir -p build/7b-audit/screenshots
          audited_commit="$(git rev-parse HEAD)"
          audited_tree="$(git rev-parse 'HEAD^{tree}')"
          mobile_tree="$(git rev-parse HEAD:apps/mobile)"
          recovery_sha="$(sha256sum ../../tests/fixtures/reliability/recovery_policy_v1.json | awk '{print $1}')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '{\n  "format": "7b-mobile-audit-context-v1",\n  "audited_commit": "%s",\n  "audited_tree": "%s",\n  "mobile_tree": "%s",\n  "event_commit": "%s",\n  "recovery_policy_sha256": "%s",\n  "run_url": "%s"\n}\n' \
            "$audited_commit" "$audited_tree" "$mobile_tree" "$GITHUB_SHA" "$recovery_sha" "$run_url" \
            > build/7b-audit/context.json
          flutter --version > build/7b-audit/flutter-version.txt

      - name: Flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee build/7b-audit/flutter-analyze.log

      - name: Flutter test
        timeout-minutes: 5
        env:
          TAKT_7B_EVIDENCE_DIR: build/7b-audit/screenshots
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee build/7b-audit/flutter-test.log

      - name: Flutter Android debug build
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build/7b-audit/android-build.log

      - name: Upload mobile release audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/mobile/build/7b-audit/
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify Flutter lockfile is committed
        run: git diff --exit-code -- pubspec.lock

      - name: Flutter iOS debug build
        run: flutter build ios --debug --no-codesign
